# Demo 1 — Workflows (Triggers, Jobs, Steps, Marketplace Actions)
#
# Key concepts:
#   - name / on / jobs / steps
#   - Triggers: push + workflow_dispatch (manual)
#   - uses (marketplace action) vs run (shell command)
#   - $GITHUB_STEP_SUMMARY for rich log output
#   - Matrix strategy (the "small upgrade")

name: "GitHub Actions Workshop"

# ── Triggers ────────────────────────────────────────────────
on:
  workflow_dispatch:

permissions:
  contents: read
    
# ── Jobs ────────────────────────────────────────────────────
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      # users: calls a market place action ──
      - name: checkout code
        uses: actions/checkout@v4

      - name: Explore teh repository
        run: |
          echo "Runner directory: $PWD"
          echo "Repository files: "
          find . -maxdepth 2 -type f | sort


# Demo 1 — Workflows (Triggers, Jobs, Steps, Actions)

name: "GitHub Actions Workshop"

# Triggers
on:
  push:
    branches:
      - main

  workflow_dispatch:

# Minimum required permissions
permissions:
  contents: read

# Jobs
jobs:
  explore:
    name: Explore Repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Explore the repository
        run: |
          echo "Runner directory: $PWD"
          echo "Repository files:"
          find . -maxdepth 2 -type f | sort

      - name: Write step summary
        run: |
          echo "## Repository Exploration" >> "$GITHUB_STEP_SUMMARY"
          echo "Repository file listing completed." >> "$GITHUB_STEP_SUMMARY"
